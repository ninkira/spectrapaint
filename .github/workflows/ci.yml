name: CI

# Runs on every PR and on pushes to main. Cross-platform sanity checks only —
# the Windows installer build (PyInstaller + Inno Setup) is intentionally a
# separate release workflow, since it must run on a Windows runner.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (runs tsc, then vite build)
        run: npm run build

  backend:
    name: Backend (import smoke + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements-runtime.txt (the lean set PyInstaller
        # bundles) and adds the test-only packages. NOT requirements.txt, a dev mega-dump.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import smoke test
        # Catches syntax errors, bad imports, and missing runtime deps.
        run: python -c "import app.main; print('app.main imported OK')"

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image (build + boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: spectrapaint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check it serves
        # A build that succeeds proves nothing about a container that starts, so this runs the
        # real entrypoint against real volumes and waits for the app to answer. The first boot
        # is also what creates and migrates the SQLite schema, so a broken migration fails here.
        run: |
          docker run -d --name spectrapaint-ci -p 8000:8000 \
            -v spectrapaint-ci-imaging:/data/imaging \
            -v spectrapaint-ci-state:/data/state \
            spectrapaint:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "healthz OK"
              curl -fsS http://localhost:8000/api/datasets
              echo
              # The built frontend has to be in the image, not just the API.
              curl -fsS http://localhost:8000/ | grep -q '<div id="root"' \
                && echo "frontend served OK"
              docker exec spectrapaint-ci test -f /data/state/app.db \
                && echo "database created on the volume OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the container never answered /healthz"
          docker logs spectrapaint-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs spectrapaint-ci || true
